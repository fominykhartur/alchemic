<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a2050"/>
      <stop offset="55%" stop-color="#181433"/>
      <stop offset="100%" stop-color="#08060f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe89a"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e8940a"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c9860a"/>
    </linearGradient>
    <radialGradient id="liquid" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffd23f"/>
      <stop offset="75%" stop-color="#ff9a1f"/>
      <stop offset="100%" stop-color="#e0680f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb43d" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff9a1f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff9a1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <clipPath id="roundedBg">
      <rect x="6" y="6" width="244" height="244" rx="54"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#bgGlow)"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="52.5" fill="none" stroke="url(#goldSoft)" stroke-width="2.5" opacity="0.75"/>

  <g clip-path="url(#roundedBg)">
    <!-- faint starfield -->
    <g fill="#ffd700" opacity="0.55">
      <circle cx="46" cy="52" r="1.6"/>
      <circle cx="206" cy="46" r="1.3"/>
      <circle cx="222" cy="96" r="1.1"/>
      <circle cx="34" cy="118" r="1.1"/>
      <circle cx="196" cy="210" r="1.4"/>
      <circle cx="40" cy="200" r="1.2"/>
    </g>

    <!-- outer alchemical circle -->
    <circle cx="128" cy="140" r="92" fill="none" stroke="url(#goldSoft)" stroke-width="2" opacity="0.4"/>

    <!-- four classical element glyphs at the diagonals of the seal -->
    <g fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linejoin="round" opacity="0.85">
      <!-- fire: triangle up (NE) -->
      <path d="M193,68 L200,80 L186,80 Z"/>
      <!-- water: triangle down (SW) -->
      <path d="M63,200 L56,188 L70,188 Z"/>
      <!-- air: triangle up + bar (NW) -->
      <path d="M63,68 L56,80 L70,80 Z M58,84 L68,84"/>
      <!-- earth: triangle down + bar (SE) -->
      <path d="M193,200 L186,188 L200,188 Z M188,184 L198,184"/>
    </g>

    <!-- glow behind flask -->
    <ellipse cx="128" cy="168" rx="58" ry="50" fill="url(#core)" filter="url(#softBlur)"/>

    <!-- retort / flask -->
    <g>
      <!-- liquid bulb -->
      <path d="M104,150 C86,162 86,196 128,196 C170,196 170,162 152,150 L152,96 L104,96 Z" fill="url(#liquid)"/>
      <!-- bubbles -->
      <circle cx="118" cy="172" r="6.5" fill="#fff6d8" opacity="0.85"/>
      <circle cx="140" cy="182" r="4" fill="#fff6d8" opacity="0.7"/>
      <circle cx="132" cy="160" r="3" fill="#fff6d8" opacity="0.6"/>
      <!-- glass outline -->
      <path d="M104,96 L104,150 C86,162 86,196 128,196 C170,196 170,162 152,150 L152,96"
            fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- neck rim -->
      <path d="M100,96 L156,96" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <!-- neck highlight -->
      <path d="M112,100 L112,144" stroke="#fff6d8" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- sparkle above flask -->
    <path d="M128,22 L134,42 L154,48 L134,54 L128,74 L122,54 L102,48 L122,42 Z" fill="url(#goldV)"/>
    <circle cx="128" cy="48" r="4.2" fill="#fffdf2"/>
  </g>
</svg>
